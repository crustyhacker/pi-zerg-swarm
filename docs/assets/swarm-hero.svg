<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" viewBox="0 0 1180 740" role="img" aria-labelledby="swarm-hero-title swarm-hero-desc">
  <title id="swarm-hero-title">Pi Zerg Swarm: native agents, teams, workflows and control</title>
  <desc id="swarm-hero-desc">A Pi-native coding-agent extension. The Pi core supplies SDK sessions, tools and model runtime to standalone agents, native teams and separately orchestrated workflow units. Structured control and management expose exact identities, logs, receipts, history and local background activity. Observation never grants execution authority.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181c2e"/>
      <stop offset="1" stop-color="#0b111b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b494ff"/>
      <stop offset="0.55" stop-color="#65ddec"/>
      <stop offset="1" stop-color="#6ce5b2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#65ddec" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="740" rx="20" fill="url(#backdrop)"/>
  <rect x="1" y="1" width="1178" height="738" rx="20" fill="none" stroke="#2c3a50"/>
  <rect x="42" y="38" width="68" height="4" rx="2" fill="url(#accent)"/>
  <path d="M 1000 38 v 25 l -12 12 v 30" fill="none" stroke="#273048" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1032 38 v 25 l -12 12 v 30" fill="none" stroke="#273048" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1064 38 v 25 l -12 12 v 30" fill="none" stroke="#273048" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1096 38 v 25 l -12 12 v 30" fill="none" stroke="#273048" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1128 38 v 25 l -12 12 v 30" fill="none" stroke="#273048" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="42" y="75" fill="#65ddec" font-family="Noto Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="2">PI / ZERG SWARM</text>
  <text x="42" y="137" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="50" font-weight="700" text-anchor="start">One Pi. A coordinated swarm.</text>
  <text x="44" y="178" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start">Native execution. Explicit control. Work you can actually inspect.</text>
  <path d="M 436 328 H 374 V 297 H 337" fill="none" stroke="#65ddec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 436 405 H 374 V 461 H 337" fill="none" stroke="#65ddec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 744 328 H 800 V 297 H 843" fill="none" stroke="#65ddec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 744 405 H 800 V 461 H 843" fill="none" stroke="#65ddec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="44" y="226" width="293" height="144" rx="12" fill="#141b28" stroke="#2c3a50"/>
  <rect x="45" y="244" width="3" height="108" rx="1" fill="#b494ff"/>
  <text x="64" y="255" fill="#b494ff" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">01 / NATIVE AGENTS</text>
  <text x="64" y="288" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start">Specialists, not scripts</text>
  <text x="64" y="320" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Own task + native Pi session</text>
  <text x="64" y="346" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Configured model + tool policy</text>
  <rect x="44" y="390" width="293" height="144" rx="12" fill="#141b28" stroke="#2c3a50"/>
  <rect x="45" y="408" width="3" height="108" rx="1" fill="#65ddec"/>
  <text x="64" y="419" fill="#65ddec" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">02 / NATIVE TEAMS</text>
  <text x="64" y="452" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start">Parallel, then lead</text>
  <text x="64" y="484" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">FIFO workers, then leader</text>
  <text x="64" y="510" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Separate native sessions</text>
  <rect x="843" y="226" width="293" height="144" rx="12" fill="#141b28" stroke="#2c3a50"/>
  <rect x="844" y="244" width="3" height="108" rx="1" fill="#65ddec"/>
  <text x="863" y="255" fill="#65ddec" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">03 / WORKFLOW ENGINE</text>
  <text x="863" y="288" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start">Graphs, not guesswork</text>
  <text x="863" y="320" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Native single-agent units</text>
  <text x="863" y="346" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">DAG · conditions · repeat</text>
  <rect x="843" y="390" width="293" height="144" rx="12" fill="#141b28" stroke="#2c3a50"/>
  <rect x="844" y="408" width="3" height="108" rx="1" fill="#6ce5b2"/>
  <text x="863" y="419" fill="#6ce5b2" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">04 / CONTROL SURFACES</text>
  <text x="863" y="452" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start">Human + API control</text>
  <text x="863" y="484" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">/zerg · zerg_control</text>
  <text x="863" y="510" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">TUI · createZergControl</text>
  <rect x="436" y="226" width="308" height="308" rx="24" fill="#1c2136" stroke="#b494ff"/>
  <rect x="458" y="249" width="264" height="4" rx="2" fill="url(#accent)"/>
  <text x="590" y="350" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="90" font-weight="700" text-anchor="middle">Pi</text>
  <text x="590" y="394" fill="#b494ff" font-family="Noto Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="2">NATIVE CORE</text>
  <text x="590" y="435" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle">SDK sessions · tools</text>
  <text x="590" y="468" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle">ModelRuntime</text>
  <text x="590" y="503" fill="#65ddec" font-family="Noto Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle">No pi-subagents required</text>
  <path d="M 590 534 V 570" fill="none" stroke="#65ddec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="44" y="570" width="1092" height="127" rx="12" fill="#141b28" stroke="#2c3a50"/>
  <text x="66" y="601" fill="#6ce5b2" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">OBSERVABLE BACKGROUND / LOCAL OWNER</text>
  <text x="66" y="636" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start">Exact sessions</text>
  <text x="326" y="636" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start">Runs + logs</text>
  <text x="561" y="636" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start">Messages + receipts</text>
  <text x="906" y="636" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start">Workflow phases</text>
  <text x="66" y="669" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Live is not saved history. Queued is not delivered. Observation is not approval.</text>
</svg>
