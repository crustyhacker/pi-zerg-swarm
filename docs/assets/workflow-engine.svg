<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1120" viewBox="0 0 1180 1120" role="img" aria-labelledby="workflow-engine-title workflow-engine-desc">
  <title id="workflow-engine-title">Workflow engine: real review DAG and trusted staged coding</title>
  <desc id="workflow-engine-desc">The built-in read-only-review graph discovers scoped targets, fans out native reviewers, collects findings, independently verifies them, and produces a deduplicated report consuming all dependency envelopes. Separate version-2 typed conditions and bounded repeat blocks extend the engine. Opt-in trusted coding requires investigation, human implementation approval, private stage writing, actual checks, independent review, human application approval, and deterministic apply. Models cannot grant either approval.</desc>
