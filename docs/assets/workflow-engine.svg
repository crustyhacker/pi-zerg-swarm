  <text x="42" y="75" fill="#65ddec" font-family="Noto Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="2">PI / ZERG SWARM</text>
  <text x="42" y="130" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="44" font-weight="700" text-anchor="start">A real engine. Not a prompt chain.</text>
  <text x="44" y="169" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start">Validated dependencies · frozen identities · bounded native admission</text>
  <rect x="44" y="200" width="1092" height="385" rx="12" fill="#141b28" stroke="#2c3a50"/>
  <text x="66" y="232" fill="#65ddec" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">READ-ONLY-REVIEW / BUILT-IN DAG</text>
  <text x="66" y="262" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Each review and verification is a native single-agent unit. Teams are separate.</text>
