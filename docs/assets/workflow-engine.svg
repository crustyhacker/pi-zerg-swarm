  <text x="453.0" y="885" fill="#b494ff" font-family="Noto Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle">HUMAN APPROVAL</text>
  <text x="453.0" y="912" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Implementation scope</text>
  <rect x="614" y="855" width="226" height="87" rx="12" fill="#101622" stroke="#65ddec"/>
