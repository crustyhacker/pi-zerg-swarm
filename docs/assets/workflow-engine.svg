  <text x="727.0" y="1022" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Exact application</text>
  <rect x="340" y="965" width="226" height="87" rx="12" fill="#101622" stroke="#6ce5b2"/>
  <text x="453.0" y="995" fill="#6ce5b2" font-family="Noto Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Apply</text>
  <text x="453.0" y="1022" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Approved bytes · per file</text>
  <path d="M 1001 942 V 962" fill="none" stroke="#65ddec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 888 1009 H 843" fill="none" stroke="#65ddec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 614 1009 H 569" fill="none" stroke="#65ddec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="66" y="988" fill="#b494ff" font-family="Noto Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">Two distinct gates.</text>
  <text x="66" y="1018" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">No model grants.</text>
  <text x="44" y="1105" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Model verdicts are evidence, not ground truth. Failed checks or unresolved gates block application.</text>
</svg>
