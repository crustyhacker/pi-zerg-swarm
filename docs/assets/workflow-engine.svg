    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181c2e"/>
      <stop offset="1" stop-color="#0b111b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b494ff"/>
      <stop offset="0.55" stop-color="#65ddec"/>
      <stop offset="1" stop-color="#6ce5b2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#65ddec" stroke-width="1.5"/>
    </marker>
  </defs>
