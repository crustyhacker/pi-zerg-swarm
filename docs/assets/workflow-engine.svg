  <text x="312" y="282" fill="#65ddec" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">PARALLEL FAN-OUT</text>
  <path d="M 154 451 V 558 H 1038 V 454" fill="none" stroke="#65ddec" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="4 6"/>
