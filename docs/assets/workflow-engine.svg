  <text x="727.0" y="912" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Private candidate</text>
  <rect x="888" y="855" width="226" height="87" rx="12" fill="#101622" stroke="#6ce5b2"/>
  <text x="1001.0" y="885" fill="#6ce5b2" font-family="Noto Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Check</text>
  <text x="1001.0" y="912" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Actual approved profile</text>
