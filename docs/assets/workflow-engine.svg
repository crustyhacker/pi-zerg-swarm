  <text x="644" y="579" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Report consumes all dependency envelopes</text>
  <rect x="44" y="607" width="529" height="170" rx="12" fill="#141b28" stroke="#2c3a50"/>
  <text x="66" y="638" fill="#b494ff" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">TYPED CONDITIONS / VERSION 2</text>
  <text x="66" y="674" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">when: boolean · eq · comparisons · all / any</text>
  <text x="66" y="706" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">False &gt; condition-false; no native unit created.</text>
  <text x="66" y="739" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Schema-checked data, not expression evaluation.</text>
  <rect x="594" y="607" width="542" height="170" rx="12" fill="#141b28" stroke="#2c3a50"/>
  <text x="616" y="638" fill="#65ddec" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">BOUNDED REPEAT / VERSION 2</text>
  <text x="616" y="674" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">State &gt; body DAG &gt; feedback &gt; until</text>
  <text x="616" y="706" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">1–32 iterations; cleanup settles before the next.</text>
  <text x="616" y="739" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Limit without convergence is not success.</text>
  <rect x="44" y="801" width="1092" height="277" rx="12" fill="#141b28" stroke="#2c3a50"/>
  <text x="66" y="834" fill="#6ce5b2" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">TRUSTED STAGED CODING / OPT-IN VERSION 3</text>
