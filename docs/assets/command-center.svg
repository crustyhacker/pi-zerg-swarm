<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="980" viewBox="0 0 1180 980" role="img" aria-labelledby="command-center-title command-center-desc">
  <title id="command-center-title">Command center: illustrative management and exact-session views</title>
  <desc id="command-center-desc">A schematic, not a screenshot or live data. The two-line local background widget links through Alt+G to the same management view as /zerg config. Tree, detail, settings and management chat are shown alongside a separate exact-session coding view. Live, captured, saved and unavailable states are distinct. Receipts distinguish local recording, native queue acceptance and observed consumption. Workflow pause blocks only new admission; it does not stop active work.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181c2e"/>
      <stop offset="1" stop-color="#0b111b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b494ff"/>
      <stop offset="0.55" stop-color="#65ddec"/>
      <stop offset="1" stop-color="#6ce5b2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#65ddec" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="980" rx="20" fill="url(#backdrop)"/>
  <rect x="1" y="1" width="1178" height="978" rx="20" fill="none" stroke="#2c3a50"/>
  <rect x="42" y="38" width="68" height="4" rx="2" fill="url(#accent)"/>
  <path d="M 1000 38 v 25 l -12 12 v 30" fill="none" stroke="#273048" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1032 38 v 25 l -12 12 v 30" fill="none" stroke="#273048" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1064 38 v 25 l -12 12 v 30" fill="none" stroke="#273048" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1096 38 v 25 l -12 12 v 30" fill="none" stroke="#273048" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1128 38 v 25 l -12 12 v 30" fill="none" stroke="#273048" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="42" y="75" fill="#65ddec" font-family="Noto Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="2">PI / ZERG SWARM</text>
  <text x="42" y="130" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="46" font-weight="700" text-anchor="start">See the work. Keep control.</text>
  <text x="44" y="169" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">ILLUSTRATIVE SCHEMATIC / fictional identities and counts · not a screenshot</text>
  <rect x="44" y="198" width="1092" height="89" rx="12" fill="#1b2332" stroke="#65ddec"/>
  <rect x="66" y="218" width="8" height="8" rx="2" fill="#65ddec"/>
  <text x="86" y="231" fill="#65ddec" font-family="Noto Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">Zerg · Review: working · 3 agents working · 2 agents queued</text>
  <text x="66" y="266" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Local owner only · checks / approvals / cleanup are separate phases</text>
  <rect x="966" y="215" width="150" height="50" rx="8" fill="#253348"/>
  <text x="1041" y="246" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Alt+G</text>
  <path d="M 1041 287 V 325 H 704 V 331" fill="none" stroke="#65ddec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="66" y="316" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Alt+G opens the same view as /zerg config—even with the strip hidden.</text>
  <rect x="44" y="334" width="700" height="356" rx="12" fill="#141b28" stroke="#2c3a50"/>
  <text x="66" y="365" fill="#6ce5b2" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">MANAGEMENT / /zerg config</text>
  <rect x="60" y="386" width="236" height="198" rx="8" fill="#101622" stroke="#2c3a50"/>
  <text x="76" y="413" fill="#65ddec" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">TREE</text>
  <text x="76" y="447" fill="#edf3ff" font-family="DejaVu Sans Mono, monospace" font-size="17">team / review</text>
  <text x="76" y="478" fill="#65ddec" font-family="DejaVu Sans Mono, monospace" font-size="16">├─ worker A · live</text>
  <text x="76" y="509" fill="#65ddec" font-family="DejaVu Sans Mono, monospace" font-size="16">├─ worker B · live</text>
  <text x="76" y="540" fill="#a8b8d0" font-family="DejaVu Sans Mono, monospace" font-size="16">└─ leader · queued</text>
  <rect x="308" y="386" width="420" height="198" rx="8" fill="#101622" stroke="#2c3a50"/>
  <text x="328" y="413" fill="#65ddec" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">DETAIL</text>
  <text x="328" y="447" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">Selected member · run / task / session</text>
  <text x="328" y="479" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Mode · tools · lifecycle · bounded logs</text>
  <text x="328" y="511" fill="#65ddec" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">v  Exact coding view     t  Timeline</text>
  <text x="328" y="548" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">A row label is never a routing key.</text>
  <rect x="60" y="596" width="318" height="77" rx="8" fill="#101622" stroke="#2c3a50"/>
  <text x="76" y="621" fill="#b494ff" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">SETTINGS</text>
  <text x="76" y="650" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Mode · read-only · UI preferences</text>
  <rect x="390" y="596" width="338" height="77" rx="8" fill="#101622" stroke="#2c3a50"/>
  <text x="406" y="621" fill="#6ce5b2" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">MANAGEMENT CHAT</text>
  <text x="406" y="650" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Intervention history, not live send</text>
  <rect x="766" y="334" width="370" height="356" rx="12" fill="#141b28" stroke="#b494ff"/>
  <text x="786" y="365" fill="#b494ff" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">SEPARATE CODING VIEW</text>
  <text x="786" y="404" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start">Exact session, explicitly selected</text>
  <text x="786" y="440" fill="#65ddec" font-family="DejaVu Sans Mono, monospace" font-size="17">parentRunId</text>
  <text x="786" y="468" fill="#65ddec" font-family="DejaVu Sans Mono, monospace" font-size="17">memberRunId</text>
  <text x="786" y="496" fill="#65ddec" font-family="DejaVu Sans Mono, monospace" font-size="17">piSessionId</text>
  <path d="M 786 516 H 1116" fill="none" stroke="#2c3a50" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="786" y="550" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Live text · thinking · tool activity</text>
  <text x="786" y="583" fill="#65ddec" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">c  Compose   Ctrl+S  Explicit send</text>
  <text x="786" y="621" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Accepting live default branch only.</text>
  <text x="786" y="654" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Messaging to workflow units is blocked.</text>
  <rect x="44" y="711" width="520" height="218" rx="12" fill="#141b28" stroke="#2c3a50"/>
  <text x="66" y="742" fill="#65ddec" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">SESSION VIEW STATES</text>
  <text x="66" y="778" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start">live</text>
  <text x="211" y="778" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Connected owner observer</text>
  <text x="66" y="818" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start">captured</text>
  <text x="211" y="818" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Final bounded display after detach</text>
  <text x="66" y="858" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start">saved</text>
  <text x="211" y="858" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Validated Pi JSONL history</text>
  <text x="66" y="898" fill="#edf3ff" font-family="Noto Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start">unavailable</text>
  <text x="211" y="898" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Missing / unsafe / disconnected</text>
  <rect x="586" y="711" width="550" height="218" rx="12" fill="#141b28" stroke="#2c3a50"/>
  <text x="608" y="742" fill="#6ce5b2" font-family="Noto Sans, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">MESSAGE RECEIPTS / NOT COMPLETION</text>
  <text x="608" y="778" fill="#6ce5b2" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start">recorded &gt; queued &gt; delivered</text>
  <text x="608" y="812" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Local intent &gt; native accepted &gt; consumption observed</text>
  <text x="608" y="846" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">No provider acknowledgement or task-success proof</text>
  <text x="608" y="880" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">failed: rejected before enqueue; uncertain: needs-attention</text>
  <text x="608" y="911" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Persistence memory / saved / failed is a separate axis.</text>
  <text x="44" y="957" fill="#a8b8d0" font-family="Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Pause blocks new workflow admission—not active work. Closing a view or hiding the strip does not cancel.</text>
</svg>
